            animation-delay: 0.15s;
        }

        .fade-up-3 {
            animation-delay: 0.25s;
        }

        .fade-up-4 {
            animation-delay: 0.35s;
        }

        .fade-up-5 {
            animation-delay: 0.45s;
        }

        .float-soft {
            animation: floatSoft 6s ease-in-out infinite;
        }

        .gold-text {
            background: linear-gradient(112deg, #8A6528 0%, #C9A86A 28%, #F0DCAA 48%, #C9A86A 68%, #9B772F 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .outline-number {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(201, 168, 106, 0.72);
        }

        .pattern-bg {
            background-image: radial-gradient(circle at 1px 1px, rgba(201, 168, 106, 0.28) 1px, transparent 0);
            background-size: 22px 22px;
        }

        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .btn-gold {
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(169, 131, 63, 0.32);
        }

        .btn-outline {
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .btn-outline:hover {
            transform: translateY(-2px);
            background: rgba(11, 61, 46, 0.06);
        }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        .placeholder\:text-\[var\(--muted-2\)\]::-moz-placeholder {
            color: var(--muted-2);
        }

        .placeholder\:text-\[var\(--muted-2\)\]::placeholder {
            color: var(--muted-2);
        }

        .hover\:text-\[var\(--ink\)\]:hover {
            color: var(--ink);
        }

        .hover\:text-white:hover {
            --tw-text-opacity: 1;
            color: rgb(255 255 255 / var(--tw-text-opacity, 1));
        }

        @media (min-width: 640px) {

            .sm\:h-96 {

            .sm\:w-80 {

            .sm\:w-auto {

            }

            .sm\:flex-row {

            }

            .sm\:items-center {
                align-items: center;
            }

            .sm\:justify-start {
                justify-content: flex-start;
            }

            .sm\:justify-center {
                justify-content: center;
            }

            .sm\:p-6 {

            }

            .sm\:px-5 {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }

            .sm\:px-8 {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .sm\:py-11 {
                padding-top: 2.75rem;
                padding-bottom: 2.75rem;
            }

            .sm\:py-16 {
                padding-top: 4rem;
                padding-bottom: 4rem;
            }

            .sm\:pt-14 {

            }

            .sm\:text-left {

            }

            .sm\:text-\[11px\] {

            .sm\:text-\[22px\] {
